[package]
name = "pulse"
version = "1.0.0"
description = "Pulse - lightweight YouTube Music / YouTube / Spotify player on Tauri v2 + WebView2"
edition = "2021"
publish = false

[lib]
name = "pulse_lib"
crate-type = ["rlib"]

[[bin]]
name = "Pulse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# Same versions Tauri/wry already compile (see Cargo.lock): used for WebView2 memory target level.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
